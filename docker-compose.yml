services:
  postgres:
    image: postgres:16
    container_name: mac-invoices-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoices
    ports:
      # Published on 5433 because a natively-installed Postgres commonly already
      # holds 5432 on loopback, which would shadow this container for anything
      # connecting to localhost:5432.
      - '5433:5432'
    volumes:
      - mac-invoices-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invoices']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mac-invoices-pgdata:
