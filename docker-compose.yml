services:
  postgres:
    image: postgres:16
    container_name: mac-invoices-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoices
    ports:
      - '5432:5432'
    volumes:
      - mac-invoices-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invoices']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mac-invoices-pgdata:
