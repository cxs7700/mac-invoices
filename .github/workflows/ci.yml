name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoices
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invoices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoices
      LANDLORD_USER_ID: landlord_seed_user
      LANDLORD_EMAIL: landlord@example.com
      # Throwaway fixture credential for the ephemeral CI Postgres. Required by the
      # seed's fail-closed guard (DEC-018/KTD-6); must match the api test helper's
      # 'changeme-dev' fallback so the integration tests can log in. NODE_ENV is not
      # 'production' here, so the default-password guard does not trip.
      LANDLORD_PASSWORD: changeme-dev
      # Throwaway ≥32-char fixture key. Required since DEC-034: every vendor
      # submission link is derived as HMAC(VENDOR_LINK_KEY, ...), so without it
      # the submissions and vendors suites all fail with VENDOR_LINK_KEY_INVALID.
      # Its only job here is to be present and long enough; nothing outlives the run.
      VENDOR_LINK_KEY: ci-fixture-vendor-link-key-not-a-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
