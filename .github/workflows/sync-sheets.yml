# Free external scheduler for continuous Google Sheets sync. Like the digest
# (notify-digest.yml), Vercel's Hobby cron is daily-only, so a GitHub Actions
# schedule pings the CRON_SECRET-gated endpoint every ~15 min. Each fire mirrors
# every connected landlord whose invoices changed since their last sync; an
# unchanged landlord is skipped (no Sheets write), so frequent pings are cheap.
#
# Setup (repo Settings → Secrets and variables → Actions) — same values as the
# digest workflow, nothing new to add if that one is already configured:
#   - Variable  APP_URL      = the production base URL (e.g. https://mac-invoices.vercel.app)
#   - Secret    CRON_SECRET  = the same value set as CRON_SECRET in Vercel
#
# Caveats: GitHub scheduled workflows are best-effort (can be delayed under load)
# and are auto-disabled after ~60 days of repo inactivity. If that bites, point a
# free pinger (e.g. cron-job.org) at the same endpoint with the Bearer header.
name: Continuous Sheets sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sheets sync flush
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "${APP_URL}/api/cron/sync-sheets" \
            -H "Authorization: Bearer ${CRON_SECRET}"
